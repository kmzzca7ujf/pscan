name: 二开版本构建发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: '仅测试构建（不发布）'
        type: boolean
        default: false
      draft:
        description: '创建草稿发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 准备 Release 版本号
        id: prep
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            # 手动触发且无 Tag 时，自动生成一个形如 v2026.09.16-manual 的版本号
            echo "tag_name=v$(date +'%Y.%m.%d')-manual" >> $GITHUB_OUTPUT
          fi

      - name: 构建和发布
        uses: ./.github/actions/build-release
        with:
          mode: ${{ inputs.snapshot && 'snapshot' || 'release' }}
          go-version: '1.26'
          retention-days: '90'

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        if: ${{ !inputs.snapshot }}
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          files: |
            pscan
            pscan-nolocal
          draft: ${{ inputs.draft }}
          generate_release_notes: true
